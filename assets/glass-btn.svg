    <text x="200" y="51" font-family="'Sora', 'Segoe UI', sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">🚀 CANLI UYGULAMAYA GİT</text>
